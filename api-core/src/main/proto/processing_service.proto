syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.arte.apicore.grpc.processing";
option java_outer_classname = "ProcessingServiceProto";

package processing;

service ProcessingService {
  rpc ProcessUserInfo(ProcessUserInfoRequest) returns (ProcessUserInfoResponse);
  rpc ProcessJobInfo(ProcessJobInfoRequest) returns (ProcessJobInfoResponse);
  rpc ProcessUserAndJob(ProcessUserAndJobRequest) returns (ProcessUserAndJobResponse);
}

message ProcessUserInfoRequest {
  string user_id = 1;
  UserInfoData user_info = 2;
  string processing_version = 3;
}

message ProcessUserInfoResponse {
  bool success = 1;
  string message = 2;
  ProcessedUserData processed_data = 3;
}

message ProcessJobInfoRequest {
  string job_id = 1;
  string raw_job_markdown = 2;
  string processing_version = 3;
}

message ProcessJobInfoResponse {
  bool success = 1;
  string message = 2;
  ProcessedJobData processed_data = 3;
}

message ProcessUserAndJobRequest {
  string user_id = 1;
  ProcessedUserData processed_user = 2;
  string job_id = 3;
  ProcessedJobData processed_job = 4;
  string processing_version = 5;
}

message ProcessUserAndJobResponse {
  bool success = 1;
  string message = 2;
  UserJobComparison comparison = 3;
}

message UserInfoData {
  string user_id = 1;
  GitHubStats github_stats = 2;
  LeetCodeStats leetcode_stats = 3;
  ResumeSummary resume_summary = 4;
}

message GitHubStats {
  int32 total_stars = 1;
  int32 total_forks = 2;
  int32 total_pinned_repos = 3;
  repeated RepoSummary pinned_repos = 4;
  map<string, int32> language_distribution = 5;
  repeated string top_topics = 6;
  string last_synced = 7;
}

message RepoSummary {
  string name = 1;
  string url = 2;
  int32 stars = 3;
  int32 forks = 4;
  string primary_language = 5;
}

message LeetCodeStats {
  string username = 1;
  int32 total_solved = 2;
  int32 easy_solved = 3;
  int32 medium_solved = 4;
  int32 hard_solved = 5;
  int32 ranking = 6;
  int32 reputation = 7;
  double star_rating = 8;
  int32 contests_attended = 9;
  double contest_rating = 10;
  int32 global_ranking = 11;
  double top_percentage = 12;
  map<string, int32> language_stats = 13;
}

message ResumeSummary {
  string file_name = 1;
  int32 word_count = 2;
  string raw_text = 3;
  repeated string skills = 4;
  repeated string experiences = 5;
  repeated string education = 6;
  string summary = 7;
}

message ProcessedUserData {
  string user_id = 1;
  repeated string technical_skills = 2;
  repeated string soft_skills = 3;
  repeated WorkExperience work_experiences = 4;
  repeated string certifications = 5;
  repeated string education = 6;
  int32 years_of_experience = 7;
  repeated string programming_languages = 8;
  repeated string frameworks = 9;
  repeated string tools = 10;
  string career_level = 11;
  repeated string domains = 12;
}

message WorkExperience {
  string title = 1;
  string company = 2;
  string duration = 3;
  repeated string responsibilities = 4;
  repeated string technologies = 5;
}

message ProcessedJobData {
  string job_id = 1;
  string job_title = 2;
  string company = 3;
  repeated string required_skills = 4;
  repeated string preferred_skills = 5;
  int32 min_years_experience = 6;
  int32 max_years_experience = 7;
  repeated string required_education = 8;
  repeated string programming_languages = 9;
  repeated string frameworks = 10;
  repeated string tools = 11;
  string career_level = 12;
  repeated string domains = 13;
  repeated string responsibilities = 14;
}

message UserJobComparison {
  string user_id = 1;
  string job_id = 2;
  int32 overall_match_score = 3;
  int32 skills_match_score = 4;
  int32 experience_match_score = 5;
  int32 education_match_score = 6;
  repeated SkillGap skill_gaps = 7;
  repeated string strengths = 8;
  repeated string recommendations = 9;
  string fit_assessment = 10;
}

message SkillGap {
  string skill_name = 1;
  string gap_type = 2;
  string priority = 3;
}